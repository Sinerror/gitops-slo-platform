{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "boutique.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "boutique.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "boutique.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 5
      securityContext:
        {{- include "boutique.podSecurityContext" $ | nindent 8 }}
      {{- include "boutique.spread" $name | nindent 6 }}
      containers:
        - name: server
          image: {{ include "boutique.image" (list $ $name) }}
          {{- if and (eq $name "checkoutservice") $.Values.images.checkoutservice.tag }}
          imagePullPolicy: {{ $.Values.own.pullPolicy }}
          {{- end }}
          securityContext:
            {{- include "boutique.containerSecurityContext" $ | nindent 12 }}
          ports:
            - name: {{ if eq $svc.probe "http" }}http{{ else }}grpc{{ end }}
              containerPort: {{ $svc.port }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if and (eq $name "checkoutservice") $.Values.images.checkoutservice.tag }}
            - name: KAFKA_BROKERS
              value: {{ $.Values.kafka.brokers | quote }}
            - name: KAFKA_TOPIC
              value: {{ $.Values.kafka.topic | quote }}
            {{- end }}
          {{- if eq $svc.probe "http" }}
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            httpGet:
              path: /_healthz
              port: {{ $svc.port }}
              httpHeaders:
                - name: Cookie
                  value: shop_session-id=x-readiness-probe
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 10
            httpGet:
              path: /_healthz
              port: {{ $svc.port }}
              httpHeaders:
                - name: Cookie
                  value: shop_session-id=x-liveness-probe
          {{- else }}
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            grpc: { port: {{ $svc.port }} }
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            grpc: { port: {{ $svc.port }} }
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "boutique.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: {{ if eq $svc.probe "http" }}http{{ else }}grpc{{ end }}
      port: {{ $svc.servicePort | default $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
