crds:
  enabled: true
  keep: true

# Выпуск сертификатов для Gateway по аннотации cert-manager.io/cluster-issuer
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true

resources:
  requests: { cpu: 10m, memory: 64Mi }

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
