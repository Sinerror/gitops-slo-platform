apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - podmonitor-envoy.yaml
  - servicemonitor-argocd.yaml
  - slo-rules.yaml
  - platform-alerts.yaml

# Дашборды Grafana — JSON в репозитории, sidecar Grafana подхватывает их по метке
configMapGenerator:
  - name: dashboard-boutique-slo
    files: [dashboards/boutique-slo.json]
    options:
      labels: { grafana_dashboard: "1" }
      annotations: { grafana_folder: GitOps SLO }
      disableNameSuffixHash: true
  - name: dashboard-delivery
    files: [dashboards/delivery.json]
    options:
      labels: { grafana_dashboard: "1" }
      annotations: { grafana_folder: GitOps SLO }
      disableNameSuffixHash: true
