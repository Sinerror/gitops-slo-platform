# ESO ходит в OpenBao (провайдер vault: API совместим) по Kubernetes auth (роль eso, см. scripts/openbao-init.sh).
# Никаких статических токенов в Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Пароль администратора Grafana
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef: { key: platform/grafana, property: admin-user }
    - secretKey: admin-password
      remoteRef: { key: platform/grafana, property: admin-password }
---
# Ключи объектного хранилища бэкапов: для самого хранилища и для Velero
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3
  namespace: backup-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: backup-s3
  data:
    - secretKey: access-key
      remoteRef: { key: platform/backup-s3, property: access-key }
    - secretKey: secret-key
      remoteRef: { key: platform/backup-s3, property: secret-key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: velero-credentials
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access }}
          aws_secret_access_key={{ .secret }}
  data:
    - secretKey: access
      remoteRef: { key: platform/backup-s3, property: access-key }
    - secretKey: secret
      remoteRef: { key: platform/backup-s3, property: secret-key }
---
# ExternalSecret velero-credentials создаётся в волне 0, а приложение velero (и его namespace) — в волне 1
apiVersion: v1
kind: Namespace
metadata:
  name: velero
