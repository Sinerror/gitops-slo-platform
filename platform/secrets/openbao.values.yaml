# OpenBao (форк Vault) в standalone-режиме с хранилищем pebbledb на PVC
# (не dev-режим: данные переживают рестарт; backend "file" в OpenBao 2.x удалён).
# Инициализация, распечатывание и настройка — scripts/openbao-init.sh.
# В приложения секреты доставляет External Secrets Operator, injector не нужен.
injector:
  enabled: false

server:
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
        telemetry {
          unauthenticated_metrics_access = true
        }
      }
      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname          = true
      }
  dataStorage:
    enabled: true
    size: 1Gi
  auditStorage:
    enabled: false
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

ui:
  enabled: true

serverTelemetry:
  serviceMonitor:
    enabled: true
