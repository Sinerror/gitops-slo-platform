# Corefile под управлением GitOps (по умолчанию его создаёт kubeadm).
#
# Отличие от стандартного — блок google.internal:
# frontend Online Boutique на КАЖДЫЙ запрос главной резолвит metadata.google.internal,
# чтобы понять, запущен ли он в GCP. Вне GCP запрос уходит во внешний DNS; при
# деградации upstream-DNS это давало p95 главной ~4 с (см. postmortems/00-dns-metadata-lookup.md).
# Отвечаем NXDOMAIN локально — так же, как ответил бы любой не-GCP резолвер, только сразу.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    google.internal:53 {
        errors
        template ANY ANY {
           rcode NXDOMAIN
        }
    }
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
