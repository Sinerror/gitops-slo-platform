apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/Sinerror/gitops-slo-platform.git
    targetRevision: main
    path: platform/coredns
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    # prune выключен: ConfigMap системный, удалять его при удалении приложения нельзя
    automated: { prune: false, selfHeal: true }
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
    syncOptions: [ServerSideApply=true]
